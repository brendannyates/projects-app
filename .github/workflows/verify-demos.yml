name: Verify demo showcase
on:
  push:
    paths:
      - 'showcase/**'
      - '.github/workflows/verify-demos.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify published demo navigation
        run: |
          node <<'JS'
          const {chromium} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1366,height:860}});
            const base='https://brendannyates.github.io';
            const problems=[];
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE',m.text().slice(0,300))});
            const list=[
              {name:'ESK Tracker',path:'/esk-tracker/taskpane.html?demo=1&showcase=1',title:'ESK Tracker'},
              {name:'IR Portal',path:'/IR-Portal/taskpane.html?demo=1&showcase=1',title:'IR Portal'},
              {name:'IVK Tracker',path:'/ivk-tracker/taskpane.html?showcase=1',title:'IVK Tracker'},
              {name:'Sohar Eligibility',path:'/sohar-eligibility-addin/dashboard.html?fees=1&showcase=1#benefits',title:'Sohar'}
            ];
            const master=await page.goto(base+'/projects-app/showcase/',{waitUntil:'domcontentloaded',timeout:12000});
            console.log('MASTER',master?.status(),await page.locator('#grid .card').count());
            if(master?.status()!==200 || await page.locator('#grid .card').count()<8)problems.push('Master unavailable or missing items');
            for(const item of list){
              const response=await page.goto(base+item.path,{waitUntil:'commit',timeout:12000});
              let nav=false, title='',links=0,body='';
              try {
                await page.locator('#demoHubNav').waitFor({state:'attached',timeout:6000});
                nav=true;links=await page.locator('#demoHubNav nav a').count();
              }catch(e){console.log('NAV ERROR',item.name,e.message.slice(0,200))}
              try{title=await page.title();body=(await page.locator('body').innerText({timeout:10000})).slice(0,160)}catch(e){}
              console.log('CHECK',JSON.stringify({name:item.name,status:response?.status(),nav,links,title,body}));
              if(response?.status()!==200||!nav||links!==8||!title.includes(item.title))problems.push(item.name);
            }
            if(problems.length){await browser.close();console.log('PROBLEMS',JSON.stringify(problems));process.exitCode=1;return;}
            await page.locator('#demoHubNav nav a').filter({hasText:'ESK Tracker'}).click({timeout:7000});
            await page.waitForURL(/esk-tracker\/taskpane\.html.*showcase=1/,{waitUntil:'commit',timeout:9000});
            await page.locator('#demoHubNav').waitFor({state:'attached',timeout:9000});
            console.log('SWITCH VERIFIED',page.url());
            await browser.close();
            console.log('PROBLEMS',JSON.stringify(problems));
            if(problems.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;setTimeout(()=>process.exit(1),1000)});
          JS
