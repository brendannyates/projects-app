name: Verify demo showcase
on:
  push:
    paths:
      - 'showcase/**'
      - '.github/workflows/verify-demos.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify embedded gallery and external links
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1366,height:860}});
            const url='https://brendannyates.github.io/projects-app/showcase/';
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:15000});
            if(res?.status()!==200)throw Error('Gallery not available: '+res?.status());
            const cards=page.locator('#grid .card');
            if(await cards.count()!==8)throw Error('Expected eight original entries');
            const external=['ESK Tracker','IR Portal','IVK Tracker','Sohar Eligibility · Benefits'];
            for(const name of external){
              const card=cards.filter({has:page.locator('h2',{hasText:name})});
              const btn=card.locator('button.launch');
              if(!(await btn.innerText()).includes('new tab'))throw Error(name+' not marked as new tab');
              const popupPromise=page.waitForEvent('popup',{timeout:8000});
              await btn.click();
              const popup=await popupPromise;
              const opened=popup.url();
              if(!opened.includes('brendannyates.github.io'))throw Error(name+' did not open its source');
              console.log('NEW TAB',name,opened);
              await popup.close();
              if(!await page.locator('#library').isVisible())throw Error('Library closed when launching '+name);
            }
            const internal=cards.filter({has:page.locator('h2',{hasText:'TMS Tracker'})});
            await internal.locator('button.launch').click();
            if(!await page.locator('#sidenav').isVisible())throw Error('Embedded sidebar is missing');
            if(!await page.locator('#frames iframe:not([hidden])').count())throw Error('Embedded iframe missing');
            console.log('EMBEDDED',await page.locator('#viewTitle').innerText(),await page.locator('#frames iframe:not([hidden])').getAttribute('src'));
            await page.locator('#exit').click();
            if(!await page.locator('#library').isVisible())throw Error('Gallery not restored');
            await browser.close();
            console.log('ALL CHECKS PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
